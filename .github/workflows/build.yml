name: Build Lost Legends

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out pokecrystal
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make gcc g++ git bison libpng-dev pkg-config

      - name: Build and install RGBDS 1.0.1
        run: |
          git clone --depth=1 --branch v1.0.1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -C /tmp/rgbds -j$(nproc)
          sudo make -C /tmp/rgbds install PREFIX=/usr/local
          rgbasm --version

      - name: Build ROM
        run: make -j$(nproc)

      - name: Report checksum
        run: |
          sha1sum pokecrystal.gbc
          ls -la pokecrystal.gbc

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: lost-legends-rom
          path: pokecrystal.gbc
          retention-days: 30
