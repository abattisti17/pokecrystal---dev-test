name: Build Lost Legends

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out pokecrystal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version stamp
        id: ver
        run: |
          VERSION=$(cat VERSION)
          SHA=$(git rev-parse --short=7 HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "stamp=v${VERSION}-${SHA}" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make gcc g++ git bison libpng-dev pkg-config

      - name: Build and install RGBDS 1.0.1
        run: |
          git clone --depth=1 --branch v1.0.1 https://github.com/gbdev/rgbds.git /tmp/rgbds
          make -C /tmp/rgbds -j$(nproc)
          sudo make -C /tmp/rgbds install PREFIX=/usr/local
          rgbasm --version

      - name: Build release ROM
        run: make -j$(nproc)

      - name: Build devwarp ROM
        run: make devwarp -j$(nproc)

      - name: Set up Python for smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Smoke test (headless)
        id: smoke
        continue-on-error: true
        run: |
          sudo apt-get install -yq libsdl2-2.0-0
          pip install pyboy pillow 2>&1 | tail -3
          set +e
          python test/smoke_test.py pokecrystal_devwarp.gbc --out artifacts 2>&1 \
            | grep -v "Skipping .sym line" | tee smoke.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "## Smoke test"
            echo '```'
            cat smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Name and stamp ROMs
        run: |
          mkdir -p dist
          STAMP="${{ steps.ver.outputs.stamp }}"
          cp pokecrystal.gbc          "dist/LostLegends-${STAMP}.gbc"
          cp pokecrystal_devwarp.gbc  "dist/LostLegends-devwarp.gbc"
          cp artifacts/smoke_overworld.png dist/ 2>/dev/null || true
          cp smoke.log dist/ 2>/dev/null || true
          {
            echo "Lost Legends ${STAMP}"
            echo "commit:  $(git rev-parse HEAD)"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            sha1sum dist/*.gbc
          } | tee dist/BUILDINFO.txt

      - name: Upload ROMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LostLegends-${{ steps.ver.outputs.stamp }}
          path: dist/
          retention-days: 30
